<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMS Performance Dashboard</title>
    <!-- Tải thư viện vẽ biểu đồ Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        
        /* Container Biểu đồ */
        .chart-container { position: relative; height: 500px; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>DMS PERFORMANCE DASHBOARD</h1>

    <!-- Khu vực Tab và Bộ lọc -->
    <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
        <!-- Nút chuyển Tab -->
        <div style="margin-bottom: 15px; border-bottom: 2px solid #ccc; padding-bottom: 10px;">
            <button id="btn-cdm" style="padding: 8px 20px; font-size: 15px; font-weight: bold; background: #1E60ED; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px;" onclick="switchTab('cdm')">Báo cáo Cấp CDM</button>
            <button id="btn-kam" style="padding: 8px 20px; font-size: 15px; font-weight: bold; background: #ddd; color: black; border: none; border-radius: 4px; cursor: pointer;" onclick="switchTab('kam')">Báo cáo Cấp KAM</button>
        </div>

        <!-- Dropdown lọc -->
        <div>
            <label><b>Chọn CDM:</b></label>
            <select id="select-cdm" onchange="handleCdmChange()" style="padding: 6px; margin-right: 20px; min-width: 200px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="all">-- Tất cả CDM --</option>
            </select>

            <span id="kam-filter-container" style="display: none;">
                <label><b>Chọn KAM:</b></label>
                <select id="select-kam" onchange="renderChartWithFilters()" style="padding: 6px; min-width: 200px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="all">-- Tất cả KAM --</option>
                </select>
            </span>
        </div>
    </div>

    <!-- Khu vực Biểu đồ -->
    <div class="chart-container">
        <canvas id="coverageChart"></canvas>
    </div>
</div>

<script>
    const API_URL = "https://dms-api.nguyen842.workers.dev";
    let filterDataList = [];
    let myChartInstance = null; // Biến giữ biểu đồ để xóa trước khi vẽ lại

    // Khởi chạy khi load trang
    document.addEventListener("DOMContentLoaded", async () => {
        await loadFilters();
        renderChartWithFilters();
    });

    // 1. Lấy danh sách bộ lọc từ API
    async function loadFilters() {
        try {
            const res = await fetch(`${API_URL}?action=filters`);
            filterDataList = await res.json();
            
            // Lọc danh sách CDM không trùng lặp
            const cdms = [...new Set(filterDataList.map(f => f.CDM))].filter(c => c);
            const selectCdm = document.getElementById("select-cdm");
            
            cdms.forEach(cdm => {
                selectCdm.innerHTML += `<option value="${cdm}">${cdm}</option>`;
            });
        } catch (error) {
            console.error("Lỗi tải bộ lọc:", error);
        }
    }

    // 2. Chuyển đổi Tab CDM/KAM
    function switchTab(tab) {
        // Đổi màu nút
        document.getElementById("btn-cdm").style.background = tab === 'cdm' ? "#1E60ED" : "#ddd";
        document.getElementById("btn-cdm").style.color = tab === 'cdm' ? "white" : "black";
        document.getElementById("btn-kam").style.background = tab === 'kam' ? "#1E60ED" : "#ddd";
        document.getElementById("btn-kam").style.color = tab === 'kam' ? "white" : "black";
        
        // Hiện/ẩn bộ lọc KAM
        document.getElementById("kam-filter-container").style.display = tab === 'kam' ? "inline" : "none";
        
        // Reset bộ lọc
        document.getElementById("select-cdm").value = "all";
        document.getElementById("select-kam").innerHTML = '<option value="all">-- Tất cả KAM --</option>';
        
        // Vẽ lại biểu đồ
        renderChartWithFilters();
    }

    // 3. Xử lý khi chọn CDM (Bộ lọc thác)
    function handleCdmChange() {
        const selectedCdm = document.getElementById("select-cdm").value;
        const selectKam = document.getElementById("select-kam");
        
        // Reset danh sách KAM
        selectKam.innerHTML = '<option value="all">-- Tất cả KAM --</option>';
        
        if (selectedCdm !== "all") {
            const kams = filterDataList.filter(f => f.CDM === selectedCdm).map(f => f.KAM);
            const uniqueKams = [...new Set(kams)].filter(k => k);
            uniqueKams.forEach(kam => {
                selectKam.innerHTML += `<option value="${kam}">${kam}</option>`;
            });
        }
        
        // Vẽ lại biểu đồ sau khi chọn
        renderChartWithFilters();
    }

    // 4. Đọc tham số lọc và gọi API vẽ biểu đồ
    function renderChartWithFilters() {
        const cdm = document.getElementById("select-cdm").value;
        const isKamTab = document.getElementById("kam-filter-container").style.display !== "none";
        const kam = isKamTab ? document.getElementById("select-kam").value : "all";
        
        fetchDataAndDraw(cdm, kam);
    }

    // 5. Kéo dữ liệu thực tế và vẽ
    async function fetchDataAndDraw(cdm, kam) {
        try {
            const res = await fetch(`${API_URL}?action=coverage&cdm=${encodeURIComponent(cdm)}&kam=${encodeURIComponent(kam)}`);
            const data = await res.json();

            const labels = data.map(d => `Tháng ${d.Month}/${d.Year}`);
            const coverage = data.map(d => d.coverage);
            const active = data.map(d => d.active_outlets);

            // Hủy biểu đồ cũ nếu đã tồn tại
            if (myChartInstance) {
                myChartInstance.destroy();
            }

            const ctx = document.getElementById('coverageChart').getContext('2d');
            myChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'bar',
                            label: 'Coverage',
                            data: coverage,
                            backgroundColor: '#1E60ED',
                            order: 2
                        },
                        {
                            type: 'line',
                            label: 'Active Outlets',
                            data: active,
                            borderColor: '#FD7E14',
                            backgroundColor: '#FD7E14',
                            borderWidth: 3,
                            fill: false,
                            tension: 0.1,
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'COVERAGE & ACTIVE OUTLET PERFORMANCE', font: { size: 18 } }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        } catch (error) {
            console.error("Lỗi vẽ biểu đồ:", error);
        }
    }
</script>

</body>
</html>
